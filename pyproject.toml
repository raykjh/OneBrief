[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "onebrief"
version = "0.1.0"
description = "A budget-aware autonomous team for long-form knowledge work."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "filelock>=3.18,<4",
  "google-adk==2.6.2",
  "google-cloud-aiplatform[agent_engines]>=1.112,<2",
  "google-cloud-run>=0.16,<1",
  "google-cloud-storage>=3.4,<4",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
  "xlsxwriter>=3.2,<4",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[project.scripts]
onebrief = "onebrief.entrypoint:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/onebrief"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

